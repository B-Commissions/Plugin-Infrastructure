name: Build & Publish NuGet

on:
  push:
    branches: [main]
  create:
    tags:
      - 'v*'

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  ALL_PROJECTS: >-
    BlueBeard.Cooldowns
    BlueBeard.Core
    BlueBeard.Database
    BlueBeard.Effects
    BlueBeard.Events
    BlueBeard.Holograms
    BlueBeard.Items
    BlueBeard.OpenMod
    BlueBeard.RocketMod
    BlueBeard.SnapLogic
    BlueBeard.UI
    BlueBeard.Zones

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            VERSION="0.1.0-ci.${{ github.run_number }}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved version: $VERSION"

      - name: Determine projects to publish
        id: changes
        run: |
          # Always publish all packages at the coordinated version. dotnet pack
          # writes ProjectReference deps at the build-time version, so every
          # downstream package's nupkg pins its upstream dep to the current run's
          # version — which means every upstream must also be pushed at that
          # version, or NuGet restore fails. Selective publishing is incompatible
          # with this versioning model. NuGet's --skip-duplicate makes pushing
          # unchanged packages cheap.
          echo "Publishing all projects at the coordinated version"
          echo "projects=$(echo $ALL_PROJECTS | xargs)" >> "$GITHUB_OUTPUT"

      - name: Restore
        if: steps.changes.outputs.projects != ''
        run: dotnet restore Infastructure.sln

      - name: Build
        if: steps.changes.outputs.projects != ''
        run: dotnet build Infastructure.sln --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Pack
        if: steps.changes.outputs.projects != ''
        run: |
          for project in ${{ steps.changes.outputs.projects }}; do
            dotnet pack "$project/$project.csproj" \
              --configuration Release \
              --no-build \
              --output ./nupkgs \
              -p:Version=${{ steps.version.outputs.version }}
          done

      - name: Push to NuGet.org
        if: steps.changes.outputs.projects != ''
        run: |
          for package in ./nupkgs/*.nupkg; do
            dotnet nuget push "$package" \
              --source https://api.nuget.org/v3/index.json \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --skip-duplicate
          done

      - name: Nothing to publish
        if: steps.changes.outputs.projects == ''
        run: echo "No project sources changed in this push — skipping build and publish."